<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>颯太のリスト</title>
<style>
:root { --bg:#f6f7f9; --ink:#1c2230; --muted:#687085; --line:#e1e4ea; --card:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151c; --ink:#e8eaf0; --muted:#9aa1b2; --line:#2b3240; --card:#1a1f29; color-scheme: dark; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; }
main { max-width:560px; margin:0 auto; padding:24px max(16px, env(safe-area-inset-right,0px)) 48px max(16px, env(safe-area-inset-left,0px)); display:grid; gap:16px; }
h1 { font-size:1.4rem; margin:0; }
a.app { display:grid; grid-template-columns:56px 1fr; gap:14px; align-items:center; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; }
a.app img { width:56px; height:56px; border-radius:12px; }
a.app small { color:var(--muted); display:block; }
</style>
</head>
<body>
<main>
  <h1>颯太のリスト</h1>
  <a class="app" href="../eiga100/"><img src="../eiga100/icon-180.png" alt=""><span><strong>名作映画100本</strong><small>プライム → Netflix → U-NEXT の順に見る洋画の名作</small></span></a>
</main>
</body>
</html>
